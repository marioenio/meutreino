name: Build openGym adaptation
on:
  push:
    branches: [main]
    paths: ['opengym/**', '.github/workflows/opengym-build.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: opengym-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: DuarteSantos8/openGym
          ref: b6cfe2bbd3f099523ffbf2677438864e9a09a06f
          path: _upstream
          sparse-checkout: |
            frontend
            api
            scripts
            catalogue
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: _upstream/frontend/package-lock.json
      - name: Prepare Portuguese / English local-only app
        run: python3 opengym/prepare.py _upstream
      - name: Check language configuration and history migration
        run: |
          node opengym/migration-tests.cjs
          node opengym/adaptation-tests.cjs _upstream
      - name: Install dependencies
        working-directory: _upstream/frontend
        run: npm ci --no-audit --no-fund
      - name: Test original training logic
        working-directory: _upstream/frontend
        run: npm test -- src/lib/progression.test.js src/lib/workout-model.test.js src/lib/starter.test.js
      - name: Build application and stage licensed 180 px media
        working-directory: _upstream/frontend
        run: |
          VITE_DEMO=1 npm run build
          node ../scripts/catalogue/stage-media.mjs dist
      - name: Prepare production package and corresponding source
        run: python3 opengym/build-package.py _upstream _site
      - name: Store verified build in a separate branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git -C _site init -b "opengym-build-${GITHUB_RUN_ID}"
          git -C _site config user.name 'github-actions[bot]'
          git -C _site config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C _site add --all --force
          git -C _site commit -m 'Build openGym 2.0.1 with pt-BR/en and safe legacy migration'
          git -C _site remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C _site push origin HEAD
          echo "Verified branch: opengym-build-${GITHUB_RUN_ID}" >> "$GITHUB_STEP_SUMMARY"
